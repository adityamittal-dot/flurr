<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="heroYarnTitle">
  <title id="heroYarnTitle">Placeholder illustration of a sage-green yarn skein with a crochet hook and a loose trailing thread</title>

  <!-- backdrop -->
  <circle cx="450" cy="450" r="420" fill="#e2dccb"/>
  <circle cx="450" cy="450" r="420" fill="none" stroke="#cdbfa0" stroke-width="1.5" stroke-dasharray="2 10"/>

  <!-- skein body: layered sage ellipses to suggest wound yarn -->
  <g>
    <ellipse cx="430" cy="470" rx="190" ry="160" fill="#5f6f55"/>
    <ellipse cx="430" cy="470" rx="190" ry="160" fill="none" stroke="#4a5743" stroke-width="3" stroke-dasharray="1 14"/>
    <ellipse cx="430" cy="470" rx="150" ry="124" fill="none" stroke="#798a6d" stroke-width="2.5" stroke-dasharray="1 12"/>
    <ellipse cx="430" cy="470" rx="110" ry="90" fill="none" stroke="#4a5743" stroke-width="2.5" stroke-dasharray="1 10"/>
    <ellipse cx="430" cy="470" rx="70" ry="56" fill="none" stroke="#798a6d" stroke-width="2" stroke-dasharray="1 9"/>
  </g>

  <!-- crossing wraps -->
  <g fill="none" stroke="#3f4a39" stroke-width="3" opacity="0.5">
    <path d="M250 420 Q 430 330 610 420"/>
    <path d="M250 470 Q 430 560 610 470"/>
    <path d="M260 530 Q 430 610 600 530"/>
    <path d="M270 380 Q 430 300 590 380"/>
  </g>

  <!-- crochet hook -->
  <g transform="translate(590 300) rotate(28)">
    <rect x="-8" y="0" width="16" height="190" rx="8" fill="#cf9a3d"/>
    <path d="M0 0 C -26 -18 -22 -44 2 -48 C 20 -50 26 -32 14 -22" fill="none" stroke="#cf9a3d" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- loose trailing thread for the drift / draw-in moment -->
  <path id="heroThread"
        d="M250 480 C 170 520 140 600 190 660 C 230 710 320 710 360 660 C 390 622 360 580 320 590 C 290 598 280 630 300 650"
        fill="none" stroke="#4a5743" stroke-width="5" stroke-linecap="round"/>

  <!-- small cream muzzle-toned bead accent, echo of GIGI -->
  <circle cx="620" cy="560" r="10" fill="#d9a441"/>

  <!-- hang tag -->
  <g transform="translate(700 700)">
    <path d="M0 18 L18 0" stroke="#8c8370" stroke-width="2"/>
    <rect x="10" y="10" width="110" height="46" rx="7" fill="#efe5cf" stroke="#c9bb98" stroke-width="1.5"/>
    <circle cx="26" cy="33" r="3.5" fill="#c9bb98"/>
    <text x="42" y="30" font-family="Georgia, serif" font-size="13" fill="#5f6f55">flurr</text>
    <text x="42" y="46" font-family="Georgia, serif" font-size="9" fill="#8c8370">sample image</text>
  </g>
</svg>
