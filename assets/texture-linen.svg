<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="weave" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.28" numOctaves="2" seed="4" stitchTiles="stitch" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.28 0.018" numOctaves="2" seed="9" stitchTiles="stitch" result="weft"/>
    <feBlend in="warp" in2="weft" mode="multiply" result="woven"/>
    <feColorMatrix in="woven" type="matrix"
      values="0 0 0 0 0.52
              0 0 0 0 0.47
              0 0 0 0 0.35
              0 0 0 0.14 0"/>
  </filter>
  <rect width="220" height="220" fill="#e9e4da"/>
  <rect width="220" height="220" filter="url(#weave)"/>
</svg>
