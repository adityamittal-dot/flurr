<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="wrenTitle">
  <title id="wrenTitle">Placeholder illustration of WREN the Lamb, a cream chenille amigurumi with a sage bow</title>
  <rect width="640" height="640" fill="#efeadf"/>
  <circle cx="320" cy="330" r="230" fill="#e2dccb"/>

  <!-- legs -->
  <rect x="250" y="440" width="30" height="96" rx="15" fill="#efe6d4"/>
  <rect x="306" y="448" width="30" height="88" rx="15" fill="#e7dcc3"/>
  <rect x="356" y="448" width="30" height="88" rx="15" fill="#e7dcc3"/>
  <rect x="402" y="440" width="30" height="96" rx="15" fill="#efe6d4"/>

  <!-- fluffy body -->
  <g fill="#f4ecdc">
    <circle cx="340" cy="360" r="110"/>
    <circle cx="258" cy="330" r="40"/>
    <circle cx="420" cy="330" r="42"/>
    <circle cx="300" cy="280" r="46"/>
    <circle cx="390" cy="275" r="48"/>
    <circle cx="300" cy="420" r="44"/>
    <circle cx="400" cy="420" r="44"/>
  </g>

  <!-- head -->
  <ellipse cx="236" cy="236" rx="54" ry="48" fill="#5b5247"/>
  <ellipse cx="220" cy="258" rx="22" ry="16" fill="#efe6d4"/>
  <circle cx="246" cy="224" r="5" fill="#f5f1e8"/>
  <!-- ears -->
  <ellipse cx="198" cy="206" rx="14" ry="24" fill="#5b5247" transform="rotate(-30 198 206)"/>
  <ellipse cx="268" cy="196" rx="14" ry="24" fill="#5b5247" transform="rotate(26 268 196)"/>

  <!-- bow -->
  <g transform="translate(236 300)">
    <path d="M-26 0 L0 -14 L0 14 Z" fill="#5f6f55"/>
    <path d="M26 0 L0 -14 L0 14 Z" fill="#5f6f55"/>
    <circle cx="0" cy="0" r="7" fill="#4a5743"/>
  </g>

  <!-- hang tag -->
  <g transform="translate(486 486)">
    <path d="M0 18 L18 0" stroke="#8c8370" stroke-width="2"/>
    <rect x="10" y="10" width="92" height="40" rx="6" fill="#efe5cf" stroke="#c9bb98" stroke-width="1.5"/>
    <circle cx="24" cy="30" r="3" fill="#c9bb98"/>
    <text x="38" y="27" font-family="Georgia, serif" font-size="11" fill="#5f6f55">flurr</text>
    <text x="38" y="41" font-family="Georgia, serif" font-size="8" fill="#8c8370">sample image</text>
  </g>
</svg>
