<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="gigiTitle">
  <title id="gigiTitle">Placeholder illustration of GIGI the Giraffe, a yellow chenille amigurumi with brown spots and a cream muzzle</title>
  <rect width="640" height="640" fill="#efeadf"/>
  <circle cx="320" cy="330" r="230" fill="#e2dccb"/>

  <!-- legs -->
  <rect x="236" y="430" width="34" height="120" rx="17" fill="#d9a441"/>
  <rect x="300" y="440" width="34" height="112" rx="17" fill="#cf9a3d"/>
  <rect x="368" y="438" width="34" height="114" rx="17" fill="#cf9a3d"/>
  <rect x="420" y="432" width="34" height="118" rx="17" fill="#d9a441"/>

  <!-- body -->
  <ellipse cx="340" cy="400" rx="128" ry="86" fill="#d9a441"/>

  <!-- tail -->
  <path d="M460 390 q46 10 46 52" stroke="#cf9a3d" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M250 360 q-30 -140 10 -230 q18 -34 56 -30 q34 6 32 44 q-26 70 -2 196 z" fill="#d9a441"/>

  <!-- head -->
  <ellipse cx="300" cy="118" rx="58" ry="50" fill="#d9a441"/>
  <!-- muzzle -->
  <ellipse cx="282" cy="146" rx="34" ry="24" fill="#f5f1e8"/>
  <!-- nostril -->
  <circle cx="268" cy="150" r="3.5" fill="#6b4a28"/>
  <circle cx="288" cy="152" r="3.5" fill="#6b4a28"/>
  <!-- eye -->
  <circle cx="306" cy="104" r="5" fill="#3a2d18"/>
  <!-- ears -->
  <ellipse cx="256" cy="88" rx="16" ry="26" fill="#cf9a3d" transform="rotate(-24 256 88)"/>
  <ellipse cx="342" cy="88" rx="16" ry="26" fill="#cf9a3d" transform="rotate(24 342 88)"/>
  <!-- ossicones -->
  <rect x="280" y="56" width="8" height="22" rx="4" fill="#cf9a3d"/>
  <rect x="314" y="56" width="8" height="22" rx="4" fill="#cf9a3d"/>
  <circle cx="284" cy="54" r="7" fill="#8a5a35"/>
  <circle cx="318" cy="54" r="7" fill="#8a5a35"/>

  <!-- spots -->
  <g fill="#8a5a35">
    <ellipse cx="300" cy="190" rx="12" ry="9"/>
    <ellipse cx="258" cy="260" rx="11" ry="8"/>
    <ellipse cx="330" cy="300" rx="13" ry="9"/>
    <ellipse cx="380" cy="370" rx="14" ry="10"/>
    <ellipse cx="310" cy="420" rx="12" ry="9"/>
    <ellipse cx="400" cy="420" rx="11" ry="8"/>
    <ellipse cx="270" cy="400" rx="10" ry="7"/>
    <ellipse cx="420" cy="360" rx="10" ry="8"/>
  </g>

  <!-- hang tag -->
  <g transform="translate(486 486)">
    <path d="M0 18 L18 0" stroke="#8c8370" stroke-width="2"/>
    <rect x="10" y="10" width="92" height="40" rx="6" fill="#efe5cf" stroke="#c9bb98" stroke-width="1.5"/>
    <circle cx="24" cy="30" r="3" fill="#c9bb98"/>
    <text x="38" y="27" font-family="Georgia, serif" font-size="11" fill="#5f6f55">flurr</text>
    <text x="38" y="41" font-family="Georgia, serif" font-size="8" fill="#8c8370">sample image</text>
  </g>
</svg>
