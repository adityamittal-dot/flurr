<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="marigoldTitle">
  <title id="marigoldTitle">Placeholder illustration of the Marigold Posy, a small bouquet of mustard-yellow crochet flowers with sage leaves</title>
  <rect width="640" height="640" fill="#efeadf"/>
  <circle cx="320" cy="330" r="230" fill="#e2dccb"/>

  <!-- stems -->
  <g stroke="#5f6f55" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M320 480 C 310 420 260 380 230 340"/>
    <path d="M320 480 C 320 400 320 360 320 300"/>
    <path d="M320 480 C 330 420 390 380 420 330"/>
  </g>
  <!-- leaves -->
  <g fill="#6b7a60">
    <ellipse cx="258" cy="400" rx="22" ry="11" transform="rotate(40 258 400)"/>
    <ellipse cx="368" cy="400" rx="22" ry="11" transform="rotate(-36 368 400)"/>
    <ellipse cx="320" cy="360" rx="20" ry="10" transform="rotate(5 320 360)"/>
  </g>

  <!-- flowers -->
  <g>
    <g transform="translate(230 330)">
      <g fill="#dca53a">
        <ellipse rx="26" ry="16" transform="rotate(0)"/>
        <ellipse rx="26" ry="16" transform="rotate(60)"/>
        <ellipse rx="26" ry="16" transform="rotate(120)"/>
        <ellipse rx="26" ry="16" transform="rotate(180)"/>
        <ellipse rx="26" ry="16" transform="rotate(240)"/>
        <ellipse rx="26" ry="16" transform="rotate(300)"/>
      </g>
      <circle r="14" fill="#8a5a35"/>
    </g>
    <g transform="translate(320 290)">
      <g fill="#e3b24e">
        <ellipse rx="30" ry="18"/>
        <ellipse rx="30" ry="18" transform="rotate(60)"/>
        <ellipse rx="30" ry="18" transform="rotate(120)"/>
        <ellipse rx="30" ry="18" transform="rotate(180)"/>
        <ellipse rx="30" ry="18" transform="rotate(240)"/>
        <ellipse rx="30" ry="18" transform="rotate(300)"/>
      </g>
      <circle r="16" fill="#8a5a35"/>
    </g>
    <g transform="translate(418 320)">
      <g fill="#dca53a">
        <ellipse rx="24" ry="15"/>
        <ellipse rx="24" ry="15" transform="rotate(60)"/>
        <ellipse rx="24" ry="15" transform="rotate(120)"/>
        <ellipse rx="24" ry="15" transform="rotate(180)"/>
        <ellipse rx="24" ry="15" transform="rotate(240)"/>
        <ellipse rx="24" ry="15" transform="rotate(300)"/>
      </g>
      <circle r="13" fill="#8a5a35"/>
    </g>
  </g>

  <!-- twine -->
  <path d="M296 452 q24 18 48 0" stroke="#b9a06a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- hang tag -->
  <g transform="translate(486 486)">
    <path d="M0 18 L18 0" stroke="#8c8370" stroke-width="2"/>
    <rect x="10" y="10" width="92" height="40" rx="6" fill="#efe5cf" stroke="#c9bb98" stroke-width="1.5"/>
    <circle cx="24" cy="30" r="3" fill="#c9bb98"/>
    <text x="38" y="27" font-family="Georgia, serif" font-size="11" fill="#5f6f55">flurr</text>
    <text x="38" y="41" font-family="Georgia, serif" font-size="8" fill="#8c8370">sample image</text>
  </g>
</svg>
